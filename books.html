
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Our Books - Cold Case Publishing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <h1>Our Books</h1>
    <div class="books">
    {% for title, image in books %}
        <div class="book">
            <img src="{{ url_for('static', filename='images/' + image) }}" alt="{{ title }}">
            <h3>{{ title }}</h3>
        </div>
    {% endfor %}
    </div>
</body>
</html>
